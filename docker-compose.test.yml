services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tempopoint_test
      POSTGRES_USER: tempopoint_migrator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - '127.0.0.1::5432'
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U tempopoint_migrator -d tempopoint_test']
      interval: 1s
      timeout: 3s
      retries: 30
